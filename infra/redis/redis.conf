# Users and passwords come from users.acl, rendered from secrets at start-up (see compose.yaml).
appendonly yes
appendfsync everysec
maxmemory 128mb
maxmemory-policy noeviction
# Reachable only on the internal Docker network, and the default user is disabled by the ACL file.
bind 0.0.0.0
protected-mode no
dir /data
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
aclfile /tmp/users.acl
