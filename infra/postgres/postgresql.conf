listen_addresses = '*'
password_encryption = scram-sha-256
ssl = off                      # only reachable on the internal Docker network
shared_buffers = 512MB         # sized for a 16 GB host shared with the rest of the stack
effective_cache_size = 2GB
work_mem = 16MB
max_connections = 100
log_min_duration_statement = 500
log_connections = on
log_disconnections = on
statement_timeout = 0          # set per role (astro_api 5s, astro_worker 60s)
idle_in_transaction_session_timeout = 30s
